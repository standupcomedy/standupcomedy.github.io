services:
  build:
    build:
      context: ./build
      dockerfile: Dockerfile
    container_name: standup-io-build
    working_dir: /app
    volumes:
      - ./build:/app:cached
      - ./www/assets:/app/assets:cached
      - build_node_modules:/app/node_modules
    command: tail -f /dev/null

  php:
    image: php:8.2-fpm
    container_name: standup-io-php
    volumes:
      - ./www:/var/www/html:cached
    restart: unless-stopped

  static:
    image: nginx:alpine
    container_name: standup-io-static
    depends_on:
      - php
    volumes:
      - ./www:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    restart: unless-stopped

volumes:
  build_node_modules:
